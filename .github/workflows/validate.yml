name: validate-index

# Offline historical admission and online delivery are separate required checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Require an exact publication baseline
        shell: bash
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "::error::No published base SHA; historical validation must not be skipped."
              exit 1
              ;;
          esac
      - name: Checkout exact PR base / pre-push commit with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: .baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deterministic publication behavior tests (no network)
        run: node --test scripts/index.test.mjs scripts/stage.test.mjs scripts/validator.test.mjs
      - name: Offline content / flatten / append-only / high-water admission
        run: node scripts/validate.mjs --base .baseline

  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Checkout exact publication baseline with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: .baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify mirrors and localization of new publications against the baseline
        run: node scripts/check-mirrors.mjs --base .baseline
      - name: Vendored admission rules are byte-identical to their npm release
        run: node scripts/sync-validator.mjs --verify
